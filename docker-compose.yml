services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: stock_library_postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-stock_library}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:${DB_PORT_HOST:-${DB_PORT:-5433}}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-stock_library}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: stock_library-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stock_library_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8088
      ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-stock_library}
      DB_SSLMODE: disable
      JWT_SECRET: ${JWT_SECRET:-fabric-stock-library-super-secret-jwt-key-2026}
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-72}
      AWS_REGION: ${AWS_REGION:-eu-central-1}
      AWS_S3_ACCESS_KEY: ${AWS_S3_ACCESS_KEY:-}
      AWS_S3_KEY_SECRET: ${AWS_S3_KEY_SECRET:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-pantoneclosbucket}
    ports:
      - "${BACKEND_PORT:-${PORT:-8088}}:8088"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
