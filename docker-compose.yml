services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: stock_library_postgres
    restart: always
    environment:
      POSTGRES_DB: stock_library
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stock_library"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
